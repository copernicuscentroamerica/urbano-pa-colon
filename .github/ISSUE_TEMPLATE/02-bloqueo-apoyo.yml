name: Bloqueo o solicitud de apoyo
description: Reportar una dificultad técnica, metodológica o de acceso a datos (Indica el identificador estable de la iniciativa.)
title: "[Apoyo] "
labels: ["bloqueado"]
body:
  - type: dropdown
    id: project_id
    attributes:
      label: Proyecto
      options:
        - pa-panama-oeste
        - sv-amss
        - cr-la-carpio
        - sv-la-union
        - gt-bethania
        - do-santiago
        - gt-salud-metropolitana
        - hn-distrito-central
    validations:
      required: true
  - type: textarea
    id: blocker_detail
    attributes:
      label: Dificultad o bloqueo identificado
      description: Explica qué paso del PMV está detenido.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: Intentos realizados
      description: Qué pruebas, fuentes o scripts ya se revisaron.
    validations:
      required: true
  - type: textarea
    id: help_needed
    attributes:
      label: Apoyo específico requerido
      description: Mentoría SIG/GEE, acceso institucional, despliegue GeoLibre, validación, etc.
    validations:
      required: true
